<div class="auth-page">
  <div class="glass auth-card">
    <div class="auth-header">
      <div class="auth-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary)"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
      </div>
      <h2>Welcome back</h2>
      <p>Sign in to continue to your workspace.</p>
    </div>

    <form (ngSubmit)="login()" #loginForm="ngForm" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          placeholder="name@company.com"
          required
          [(ngModel)]="user.email"
        />
        <div class="field-error" *ngIf="loginForm.submitted && !loginForm.controls?.['email']?.valid">Please enter a valid email.</div>
      </div>

      <div class="form-group">
        <div class="flex" style="justify-content: space-between; align-items: baseline;">
          <label for="password">Password</label>
          <a href="#" class="forgot-password" (click)="$event.preventDefault()">Forgot password?</a>
        </div>
        <div class="password-row">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            class="form-control"
            placeholder="••••••••"
            required
            [(ngModel)]="user.password"
          />
          <button type="button" class="pw-toggle" (click)="togglePassword()" aria-label="Toggle password">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        <div class="field-error" *ngIf="loginForm.submitted && !loginForm.controls?.['password']?.valid">Password is required.</div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loginForm.invalid">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a routerLink="/register">Sign up for free</a>
    </div>
  </div>
</div>
